<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Thần Thoại</title>
<style>body{margin:0;background:#17100e;color:#d6c8ae;font:16px system-ui;display:grid;place-items:center;height:100vh}</style>
</head><body><p id="m">Đang tải Thần Thoại…</p>
<script>
(async () => {
  const file = n => 'than-thoai-v' + n + '.html';
  const has = async n => { try { return (await fetch(file(n), { method: 'HEAD', cache: 'no-store' })).ok } catch (e) { return false } };
  const best = async list => { const ok = await Promise.all(list.map(has)); let b = 0; list.forEach((n, i) => { if (ok[i] && n > b) b = n }); return b };
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  const last = +localStorage.getItem('tt-latest') || 0;
  let n = last ? await best(range(last, last + 10)) : 0;
  if (!n) n = await best(range(1, 60));
  if (!n) { document.getElementById('m').textContent = 'Chưa tìm thấy file than-thoai-v….html trong repo.'; return }
  localStorage.setItem('tt-latest', n);
  const html = await (await fetch(file(n), { cache: 'no-store' })).text();
  document.open(); document.write(html); document.close();
})();
</script></body></html>
